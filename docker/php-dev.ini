; Local development ONLY — mounted over /usr/local/etc/php/conf.d by
; docker-compose.yml (the dev compose). It re-enables the on-screen PHP errors
; that the image's error-handling.ini deliberately turns off for production
; safety (see Dockerfile). conf.d files load alphabetically, and this is mounted
; as zz-php-dev.ini, so it loads last and wins in dev. docker-compose.prod.yml
; does NOT mount this file, so production keeps display_errors = Off.
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

; --- Session cookie: batalkan pengetatan produksi yang tidak berlaku lokal ---
; Image menyetel cookie_domain = '.vssportal.online' dan cookie_secure = 1
; (Dockerfile). Di http://localhost:8080 browser MENOLAK cookie itu — domain tak
; cocok, dan cookie Secure tak pernah dikirim lewat HTTP — sehingga login lokal
; berputar kembali ke form. Kosong = cookie diikat ke host yang sedang dipakai.
; httponly/samesite/use_strict_mode sengaja TIDAK dibatalkan: tetap benar di lokal.
session.cookie_domain =
session.cookie_secure = 0
